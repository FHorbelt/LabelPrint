name: GitHub Pages

# Veroeffentlicht gezielt den Ordner app/. Die einfache Pages-Einstellung kann
# nur die Repository-Wurzel oder /docs ausliefern — beides wuerde hier auch
# Tests, Spec und die Altfassung mit veroeffentlichen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Geometrie, Datenhaltung, Etikettentext und Service Worker. Die
      # Druckabnahme laeuft nicht mit: sie braucht Chrome und gehoert lokal hin.
      - name: Unit-Tests
        run: node --test test/*.test.mjs

  deploy:
    name: Veroeffentlichen
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
